<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract intake triage — architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--color-muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · legal-ops-department</p>
    <h1>Contract intake triage</h1>
    <p class="subtitle">Deterministic retrieval, verification, and routing around a single model judgment per field.</p>

    <svg viewBox="0 0 1120 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="legal-ops-arch-title legal-ops-arch-desc">
      <title id="legal-ops-arch-title">Contract intake triage architecture</title>
      <desc id="legal-ops-arch-desc">Pipeline in which a contract flows through deterministic cue-pattern retrieval into a single model judgment per field, whose quote is verified against the document and routed by a deterministic escalation matrix to attorney review or business self-serve, with every memo appended to an audit log and the playbook files supplying the standard the judgment is graded against.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ======================= arrows (drawn first) ======================= -->
      <!-- contract -> retrieval -->
      <line x1="152" y1="176" x2="200" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- retrieval -> judgment -->
      <line x1="344" y1="176" x2="392" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- judgment -> span check -->
      <line x1="544" y1="176" x2="592" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- span check -> routing -->
      <line x1="736" y1="176" x2="784" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- playbook -> judgment (the standard wins) -->
      <path d="M 472,312 V 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="480" y="252" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STANDARD</text>
      <!-- routing -> attorney review (escalation — the focal flow) -->
      <path d="M 928,164 H 952 Q 960,164 960,156 V 132 Q 960,124 968,124 H 992"
            fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- routing -> self-serve -->
      <path d="M 928,188 H 960 Q 968,188 968,196 V 252 Q 968,260 976,260 H 992"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- routing -> audit trail -->
      <path d="M 860,208 V 304" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="868" y="252" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="872" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">MEMO</text>

      <!-- ======================= annotation callout ======================= -->
      <text x="472" y="76" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">One model call per field. Everything around it is checkable code.</text>
      <line x1="472" y1="92" x2="472" y2="136" stroke="#7a8399" stroke-width="0.8"/>

      <!-- ======================= nodes ======================= -->
      <!-- Contract (input) -->
      <rect x="32" y="144" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="144" width="120" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="40" y="150" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="52" y="159" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="92" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contract</text>
      <text x="92" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">counterparty .txt</text>

      <!-- Retrieval (deterministic) -->
      <rect x="208" y="144" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="208" y="144" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="216" y="150" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="230" y="159" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DET</text>
      <text x="276" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retrieval</text>
      <text x="276" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">find_clause · cue regex</text>

      <!-- Field judgment (FOCAL — the only model call) -->
      <rect x="400" y="144" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="144" width="144" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="408" y="150" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="422" y="159" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="472" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Field judgment</text>
      <text x="472" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">haiku / opus / regex</text>

      <!-- Span check (deterministic) -->
      <rect x="600" y="144" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="144" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="608" y="150" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="622" y="159" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DET</text>
      <text x="668" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Span check</text>
      <text x="668" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verify_span ≥ 0.95</text>

      <!-- Routing (deterministic) -->
      <rect x="792" y="144" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="144" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="800" y="150" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="814" y="159" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DET</text>
      <text x="860" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Routing</text>
      <text x="860" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">escalation matrix</text>

      <!-- Attorney review (outcome) -->
      <rect x="992" y="96" width="104" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="992" y="96" width="104" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1044" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Attorney</text>
      <text x="1044" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">review</text>

      <!-- Self-serve (outcome) -->
      <rect x="992" y="232" width="104" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="992" y="232" width="104" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1044" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Self-serve</text>
      <text x="1044" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">business owner</text>

      <!-- Playbook (versioned files) -->
      <rect x="400" y="312" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="312" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="472" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Playbook</text>
      <text x="472" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clause-standards.md</text>

      <!-- Audit trail (store) -->
      <rect x="792" y="312" width="136" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="312" width="136" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="860" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Audit trail</text>
      <text x="860" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">intake_log.jsonl</text>

      <!-- ======================= legend ======================= -->
      <line x1="32" y1="416" x2="1088" y2="416" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="432" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">MODEL CALL</text>

      <rect x="252" y="432" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="272" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DETERMINISTIC CODE</text>

      <rect x="428" y="432" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="448" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">VERSIONED FILES</text>

      <rect x="580" y="432" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="600" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">OUTCOME</text>

      <line x1="700" y1="438" x2="732" y2="438" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="744" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ESCALATION</text>
    </svg>
  </div>
</body>
</html>
