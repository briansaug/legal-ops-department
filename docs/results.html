<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silent errors by config — eval results</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--color-muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 800px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar chart · legal-ops-department evals</p>
    <h1>Wrong answers that reached production</h1>
    <p class="subtitle">Of 120 field judgments per config: errors that self-served instead of escalating to an attorney. The metric the routing layer exists to drive down.</p>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="silent-errors-title silent-errors-desc">
      <title id="silent-errors-title">Silent production errors by eval config</title>
      <desc id="silent-errors-desc">Bar chart showing wrong field judgments that self-served without escalation: 26 for the keyword baseline, 14 for Haiku everywhere, 10 for the routed config, and 2 for Opus everywhere, which escalated 14 of its 16 total errors.</desc>
      <defs></defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- gridlines -->
      <line x1="80" y1="60"  x2="960" y2="60"  stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="180" x2="960" y2="180" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="300" x2="960" y2="300" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="80" y1="40"  x2="80"  y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <!-- y labels -->
      <text x="72" y="63"  fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">30</text>
      <text x="72" y="183" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">20</text>
      <text x="72" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">10</text>
      <text x="72" y="423" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <!-- bars -->
      <!-- baseline: 26 -->
      <rect x="136" y="108" width="112" height="312" fill="#f5f5f5"/>
      <rect x="136" y="108" width="112" height="312" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="192" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">26 / 120</text>

      <!-- B haiku: 14 -->
      <rect x="356" y="252" width="112" height="168" fill="#f5f5f5"/>
      <rect x="356" y="252" width="112" height="168" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="412" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">14 / 120</text>

      <!-- C routed: 10 -->
      <rect x="576" y="300" width="112" height="120" fill="#f5f5f5"/>
      <rect x="576" y="300" width="112" height="120" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="632" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10 / 120</text>

      <!-- A opus: 2 (focal) -->
      <rect x="796" y="396" width="112" height="24" fill="#f5f5f5"/>
      <rect x="796" y="396" width="112" height="24" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="852" y="384" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2 / 120</text>

      <!-- annotation callout -->
      <text x="852" y="140" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">Opus made 16 errors —</text>
      <text x="852" y="160" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">and escalated 14 of them.</text>
      <line x1="852" y1="172" x2="852" y2="372" stroke="#7a8399" stroke-width="0.8"/>

      <!-- x labels -->
      <text x="192" y="448" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ctrl-F baseline</text>
      <text x="192" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">$0.000 / contract</text>
      <text x="412" y="448" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B · Haiku</text>
      <text x="412" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">$0.015 / contract</text>
      <text x="632" y="448" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">C · Routed</text>
      <text x="632" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">$0.044 / contract</text>
      <text x="852" y="448" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A · Opus</text>
      <text x="852" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">$0.095 / contract</text>
    </svg>
  </div>
</body>
</html>
